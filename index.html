<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="반응속도, 클릭속도, 색깔 스트룹, 카드 짝맞추기 등 무료 두뇌 게임 모음. 친구와 점수 비교해보세요!">
<title>🎮 두뇌 게임 모음 | Brain Games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Pretendard:wght@400;500;600;700;800&display=swap');

  :root{
    --bg-deep: #1b0f28;
    --bg-panel: #241432;
    --bg-panel-2: #2e1a3f;
    --coral: #ff6b4a;
    --yellow: #ffd23f;
    --mint: #4ecdc4;
    --violet: #a78bfa;
    --cream: #fff8f0;
    --cream-dim: #cabfd6;
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(255,107,74,0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(78,205,196,0.14), transparent 40%),
      var(--bg-deep);
    color:var(--cream);
    font-family:'Pretendard', -apple-system, sans-serif;
    min-height:100vh;
    padding-bottom:64px;
    overflow-x:hidden;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:0;
    text-align:center;
    min-height:78vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }

  .hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(27,15,40,0) 35%, rgba(27,15,40,0.55) 65%, var(--bg-deep) 96%);
    z-index:1;
  }

  .hero-content{
    position:relative;
    z-index:2;
    padding:0 20px 34px;
  }

  .hero-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,210,63,0.14);
    border:1px solid rgba(255,210,63,0.45);
    color:var(--yellow);
    font-size:12.5px;
    font-weight:700;
    padding:6px 14px;
    border-radius:999px;
    letter-spacing:0.02em;
    margin-bottom:16px;
    backdrop-filter:blur(4px);
  }

  .hero-badge .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 8px var(--yellow);
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(0.7); }
  }

  h1{
    font-family:'Black Han Sans', sans-serif;
    font-size:clamp(38px, 11vw, 56px);
    line-height:1.08;
    letter-spacing:0.01em;
    color:var(--cream);
    text-shadow:0 4px 24px rgba(0,0,0,0.55), 0 0 40px rgba(255,107,74,0.25);
    margin-bottom:10px;
  }

  h1 .accent{
    background:linear-gradient(90deg, var(--coral), var(--yellow) 55%, var(--mint));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero-content p{
    color:var(--cream-dim);
    font-size:14.5px;
    font-weight:600;
    max-width:320px;
    margin:0 auto;
  }

  /* ---------- SECTION LABEL ---------- */
  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 20px;
    margin:8px 0 16px;
  }

  .section-label .flame{ font-size:20px; }

  .section-label h2{
    font-family:'Black Han Sans', sans-serif;
    font-size:19px;
    letter-spacing:0.01em;
    color:var(--cream);
  }

  .section-label .count{
    margin-left:auto;
    font-size:12px;
    color:var(--cream-dim);
    font-weight:600;
    background:rgba(255,255,255,0.06);
    padding:4px 10px;
    border-radius:999px;
  }

  /* ---------- GAME GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:0 20px;
  }

  @media (max-width:420px){
    .grid{ grid-template-columns:1fr; }
  }

  .cab{
    position:relative;
    background:var(--bg-panel);
    border-radius:20px;
    padding:20px 18px 18px;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:10px;
    border:1px solid rgba(255,255,255,0.06);
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }

  .cab::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.25) 100%);
    pointer-events:none;
  }

  .cab:active{ transform:scale(0.97); }

  .cab.glow-coral:hover{ border-color:rgba(255,107,74,0.55); box-shadow:0 0 0 1px rgba(255,107,74,0.25), 0 12px 28px -12px rgba(255,107,74,0.45); }
  .cab.glow-mint:hover{ border-color:rgba(78,205,196,0.55); box-shadow:0 0 0 1px rgba(78,205,196,0.25), 0 12px 28px -12px rgba(78,205,196,0.45); }
  .cab.glow-yellow:hover{ border-color:rgba(255,210,63,0.55); box-shadow:0 0 0 1px rgba(255,210,63,0.25), 0 12px 28px -12px rgba(255,210,63,0.45); }
  .cab.glow-violet:hover{ border-color:rgba(167,139,250,0.55); box-shadow:0 0 0 1px rgba(167,139,250,0.25), 0 12px 28px -12px rgba(167,139,250,0.45); }

  .cab-tag{
    align-self:flex-start;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.02em;
    padding:3px 9px;
    border-radius:999px;
    z-index:1;
  }
  .tag-hot{ background:rgba(255,107,74,0.18); color:var(--coral); }
  .tag-new{ background:rgba(78,205,196,0.18); color:var(--mint); }
  .tag-fun{ background:rgba(255,210,63,0.18); color:var(--yellow); }
  .tag-brain{ background:rgba(167,139,250,0.2); color:var(--violet); }

  .cab-icon{
    font-size:34px;
    z-index:1;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));
  }

  .cab-thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    z-index:1;
    background:rgba(0,0,0,0.2);
  }
  .cab-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .cab-title{
    font-family:'Black Han Sans', sans-serif;
    font-size:18px;
    z-index:1;
    line-height:1.3;
  }

  .cab-desc{
    font-size:12.5px;
    color:var(--cream-dim);
    line-height:1.5;
    z-index:1;
    min-height:36px;
  }

  .cab-cta{
    z-index:1;
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-weight:700;
    font-size:13px;
    padding:9px 0;
    border-radius:11px;
    color:var(--bg-deep);
  }
  .cta-coral{ background:var(--coral); }
  .cta-mint{ background:var(--mint); }
  .cta-yellow{ background:var(--yellow); }
  .cta-violet{ background:var(--violet); }

  /* ---------- STREAK STRIP ---------- */
  .streak{
    margin:36px 20px 0;
    background:var(--bg-panel-2);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:18px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .streak-icon{
    font-size:26px;
    flex-shrink:0;
  }
  .streak-text b{
    display:block;
    font-size:14px;
    margin-bottom:2px;
  }
  .streak-text span{
    font-size:12px;
    color:var(--cream-dim);
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    color:rgba(255,248,240,0.35);
    font-size:11.5px;
    margin-top:40px;
    padding:0 20px;
  }
</style>
</head>
